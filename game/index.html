<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141a; font-family: system-ui, sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 12px; left: 12px; color: #fff; text-shadow: 0 1px 3px #000; user-select: none; pointer-events: none; }
  #cash { font-size: 26px; font-weight: 800; }
  #health-wrap { width: 180px; height: 10px; background: #333; border: 1px solid #fff; margin-top: 6px; }
  #health { height: 100%; width: 100%; background: #2ecc71; }
  #stars { font-size: 22px; color: #ffd700; margin-top: 4px; letter-spacing: 2px; }
  #mission { font-size: 14px; margin-top: 6px; max-width: 420px; }
  #speed { font-size: 14px; margin-top: 4px; }
  #minimap { position: fixed; right: 12px; bottom: 12px; border: 2px solid #fff; background: #10141a; }
  #banner { position: fixed; top: 18%; left: 50%; transform: translateX(-50%); color: #ffd700; font-size: 22px; font-weight: 800; text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity .4s; text-align: center; pointer-events: none; }
  #screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8, 12, 20, 0.55); color: #fff; text-align: center; }
  #screen-title { font-size: 56px; font-weight: 900; letter-spacing: 4px; color: #ffd700; margin: 0; }
  #screen-text { font-size: 17px; max-width: 620px; margin: 16px; line-height: 1.5; }
  #screen-hint { font-size: 14px; color: #ccc; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="cash">$0</div>
  <div id="health-wrap"><div id="health"></div></div>
  <div id="stars">☆☆☆☆☆</div>
  <div id="mission">Solmar Bay</div>
  <div id="speed">On foot</div>
</div>
<canvas id="minimap" width="180" height="180"></canvas>
<div id="banner"></div>
<div id="screen">
  <h1 id="screen-title">SOLMAR BAY</h1>
  <p id="screen-text">Mara Voss is back in Solmar Bay. Three jobs. One city.</p>
  <p id="screen-hint">WASD move / drive &nbsp;·&nbsp; E steal or exit a car &nbsp;·&nbsp; F punch &nbsp;·&nbsp; Shift run &nbsp;·&nbsp; Mouse drag camera &nbsp;·&nbsp; P pause &nbsp;·&nbsp; Click to start</p>
</div>
<div id="status" aria-live="polite"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
